<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3年级数学薄弱点训练（80题）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .progress-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            height: 20px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .question-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .nav-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .nav-dot:hover { transform: scale(1.1); }
        .nav-dot.active { background: #6366f1; color: white; transform: scale(1.15); }
        .nav-dot.correct { background: #10b981; color: white; }
        .nav-dot.wrong { background: #ef4444; color: white; }
        .nav-dot.unanswered { background: #e2e8f0; color: #64748b; }
        
        .question {
            font-size: 22px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.6;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) {
            .options { grid-template-columns: 1fr; }
        }
        .option {
            padding: 20px;
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }
        .option:hover {
            background: #e0e7ff;
            border-color: #6366f1;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(99,102,241,0.2);
        }
        .option.correct {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }
        .option.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }
        .option:disabled {
            cursor: default;
            opacity: 0.7;
        }
        .feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feedback.correct { background: #d1fae5; color: #065f46; }
        .feedback.wrong { background: #fee2e2; color: #991b1b; }
        
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-prev { background: #e2e8f0; color: #475569; }
        .btn-next { background: #6366f1; color: white; }
        .btn-restart { background: #10b981; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 16px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border-radius: 12px;
            color: white;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        
        .answer-section {
            margin-top: 20px;
        }
        .answer-input {
            width: 100%;
            padding: 16px;
            border: 3px solid #e2e8f0;
            border-radius: 12px;
            font-size: 20px;
            text-align: center;
            transition: border-color 0.3s ease;
        }
        .answer-input:focus {
            outline: none;
            border-color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 3年级数学薄弱点训练</h1>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="currentNum">1</div>
                <div class="stat-label">当前题</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correctCount">0</div>
                <div class="stat-label">正确</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="wrongCount">0</div>
                <div class="stat-label">错误</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">正确率</div>
            </div>
        </div>
        
        <div class="card">
            <div style="text-align: center; margin-bottom: 24px;">
                <span style="font-size: 18px; color: #64748b;">当前题目：第 </span>
                <select id="questionSelect" onchange="jumpToQuestion(this.value)" style="padding: 10px 20px; border: 2px solid #6366f1; border-radius: 8px; font-size: 20px; font-weight: bold; color: #6366f1; cursor: pointer; background: white;">
                </select>
                <span style="font-size: 18px; color: #64748b;"> / 80</span>
            </div>
            
            <div class="question" id="questionText"></div>
            
            <div class="options" id="optionsContainer"></div>
            
            <div class="answer-section" id="answerSection" style="display: none;">
                <input type="text" class="answer-input" id="answerInput" placeholder="输入你的答案...">
            </div>
            
            <div class="feedback" id="feedback" style="display: none;"></div>
            
            <div class="buttons">
                <button class="btn btn-prev" id="prevBtn" onclick="prevQuestion()">上一题</button>
                <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()">下一题</button>
            </div>
        </div>
    </div>

    <script>
        // 80道题目数据
        const questions = [
            // 概念辨析题（20道）
            { type: 'concept', question: '一个数的倍数一定比它的因数大', options: ['正确', '错误'], correct: 1, reason: '一个数的最小倍数等于最大因数，都等于它本身' },
            { type: 'concept', question: '1小时等于3600秒', options: ['正确', '错误'], correct: 0, reason: '1小时=60分，1分=60秒，所以1小时=60×60=3600秒' },
            { type: 'concept', question: '长方形周长计算公式是2×(长+宽)', options: ['正确', '错误'], correct: 0, reason: '长方形周长=2×(长+宽)' },
            { type: 'concept', question: '一个数最大的因数是它本身', options: ['正确', '错误'], correct: 0, reason: '一个数最小的因数是1，最大的因数是它本身' },
            { type: 'concept', question: '倍数和因数是独立存在的概念', options: ['正确', '错误'], correct: 1, reason: '倍数和因数是成对出现的，不能独立存在' },
            { type: 'concept', question: '0是任何数的因数', options: ['正确', '错误'], correct: 1, reason: '0不能作除数，所以0不是任何数的因数' },
            { type: 'concept', question: '正方形的周长是边长的4倍', options: ['正确', '错误'], correct: 0, reason: '正方形周长=边长×4' },
            { type: 'concept', question: '1千米=1000米', options: ['正确', '错误'], correct: 0, reason: '长度单位换算：1千米=1000米' },
            { type: 'concept', question: '1吨=1000千克', options: ['正确', '错误'], correct: 0, reason: '质量单位换算：1吨=1000千克' },
            { type: 'concept', question: '长方形和正方形都是特殊的平行四边形', options: ['正确', '错误'], correct: 0, reason: '长方形和正方形都有两组对边平行且相等' },
            { type: 'concept', question: '分数的分子表示取了几份', options: ['正确', '错误'], correct: 0, reason: '分子表示取的份数，分母表示平均分成几份' },
            { type: 'concept', question: '1千克棉花比1千克铁轻', options: ['正确', '错误'], correct: 1, reason: '同样都是1千克，重量相等' },
            { type: 'concept', question: '三位数乘一位数，积一定是四位数', options: ['正确', '错误'], correct: 1, reason: '如100×2=200，积是三位数' },
            { type: 'concept', question: '0乘任何数都得0', options: ['正确', '错误'], correct: 0, reason: '0乘任何数都得0' },
            { type: 'concept', question: '1米的十分之一是一厘米', options: ['正确', '错误'], correct: 0, reason: '1米=100厘米，十分之一就是10厘米' },
            { type: 'concept', question: '两个正方形拼在一起一定是长方形', options: ['正确', '错误'], correct: 1, reason: '如果边长相等拼在一起，可能是长方形，也可能是更大的正方形' },
            { type: 'concept', question: '周长相等的两个长方形，面积一定相等', options: ['正确', '错误'], correct: 1, reason: '周长相等但长宽不同，面积可能不同' },
            { type: 'concept', question: '被除数和除数相同，商是1', options: ['正确', '错误'], correct: 0, reason: '任何非零数除以它本身商都是1' },
            { type: 'concept', question: '把5个苹果分给5个人，每人一定分到1个', options: ['正确', '错误'], correct: 1, reason: '没有说平均分，每人分到的不一定一样多' },
            { type: 'concept', question: '边长1厘米的正方形，周长和面积相等', options: ['正确', '错误'], correct: 1, reason: '周长是4厘米，面积是1平方厘米，单位不同不能比较' },
            
            // 计算题（20道）
            { type: 'calc', question: '25 × 4 = ?', answer: '100' },
            { type: 'calc', question: '125 × 8 = ?', answer: '1000' },
            { type: 'calc', question: '360 ÷ 9 = ?', answer: '40' },
            { type: 'calc', question: '48 × 5 = ?', answer: '240' },
            { type: 'calc', question: '720 ÷ 8 = ?', answer: '90' },
            { type: 'calc', question: '15 × 6 = ?', answer: '90' },
            { type: 'calc', question: '24 × 5 = ?', answer: '120' },
            { type: 'calc', question: '560 ÷ 7 = ?', answer: '80' },
            { type: 'calc', question: '18 × 5 = ?', answer: '90' },
            { type: 'calc', question: '630 ÷ 9 = ?', answer: '70' },
            { type: 'calc', question: '22 × 4 = ?', answer: '88' },
            { type: 'calc', question: '420 ÷ 6 = ?', answer: '70' },
            { type: 'calc', question: '35 × 2 = ?', answer: '70' },
            { type: 'calc', question: '810 ÷ 9 = ?', answer: '90' },
            { type: 'calc', question: '45 × 2 = ?', answer: '90' },
            { type: 'calc', question: '540 ÷ 6 = ?', answer: '90' },
            { type: 'calc', question: '12 × 8 = ?', answer: '96' },
            { type: 'calc', question: '640 ÷ 8 = ?', answer: '80' },
            { type: 'calc', question: '27 × 3 = ?', answer: '81' },
            { type: 'calc', question: '450 ÷ 5 = ?', answer: '90' },
            
            // 应用题（40道）
            { type: 'apply', question: '小明有12个苹果，平均分给4个小朋友，每人几个？', answer: '3', steps: '12÷4=3' },
            { type: 'apply', question: '每箱25本，3箱共多少本？', answer: '75', steps: '25×3=75' },
            { type: 'apply', question: '长8厘米，宽6厘米，长方形周长是多少？', answer: '28', steps: '2×(8+6)=28厘米' },
            { type: 'apply', question: '一辆车每小时行60千米，3小时行多少千米？', answer: '180', steps: '60×3=180千米' },
            { type: 'apply', question: '一共有48个学生，每6人一组，可以分几组？', answer: '8', steps: '48÷6=8组' },
            { type: 'apply', question: '一块正方形地边长9米，周长多少米？', answer: '36', steps: '9×4=36米' },
            { type: 'apply', question: '每本书8元，买5本书多少钱？', answer: '40', steps: '8×5=40元' },
            { type: 'apply', question: '36颗糖平均分给6个小朋友，每人几颗？', answer: '6', steps: '36÷6=6颗' },
            { type: 'apply', question: '长5米，宽3米的长方形面积是多少？', answer: '15', steps: '5×3=15平方米' },
            { type: 'apply', question: '一箱苹果24个，4箱多少个？', answer: '96', steps: '24×4=96个' },
            { type: 'apply', question: '72个同学排队，每排8人，可以排几排？', answer: '9', steps: '72÷8=9排' },
            { type: 'apply', question: '正方形边长7厘米，周长多少厘米？', answer: '28', steps: '7×4=28厘米' },
            { type: 'apply', question: '每盒12支笔，买3盒多少支？', answer: '36', steps: '12×3=36支' },
            { type: 'apply', question: '60个苹果，每5个装一袋，可以装几袋？', answer: '12', steps: '60÷5=12袋' },
            { type: 'apply', question: '长10分米，宽6分米的长方形周长是多少？', answer: '32', steps: '2×(10+6)=32分米' },
            { type: 'apply', question: '一打铅笔12支，4打多少支？', answer: '48', steps: '12×4=48支' },
            { type: 'apply', question: '54本笔记本，每9本捆一包，可以捆几包？', answer: '6', steps: '54÷9=6包' },
            { type: 'apply', question: '边长6分米的正方形面积是多少？', answer: '36', steps: '6×6=36平方分米' },
            { type: 'apply', question: '每袋5千克，8袋多少千克？', answer: '40', steps: '5×8=40千克' },
            { type: 'apply', question: '42个气球，平均分给7个小朋友，每人几个？', answer: '6', steps: '42÷7=6个' },
            { type: 'apply', question: '长方形长9米，宽4米，周长是多少？', answer: '26', steps: '2×(9+4)=26米' },
            { type: 'apply', question: '每包6颗糖，8包多少颗？', answer: '48', steps: '6×8=48颗' },
            { type: 'apply', question: '81块蛋糕，每9块装一盒，可以装几盒？', answer: '9', steps: '81÷9=9盒' },
            { type: 'apply', question: '边长8米的正方形草地，周长多少米？', answer: '32', steps: '8×4=32米' },
            { type: 'apply', question: '每筐15个苹果，4筐多少个？', answer: '60', steps: '15×4=60个' },
            { type: 'apply', question: '56个小朋友，每8人一组，可以分几组？', answer: '7', steps: '56÷8=7组' },
            { type: 'apply', question: '长7厘米，宽5厘米的长方形面积是多少？', answer: '35', steps: '7×5=35平方厘米' },
            { type: 'apply', question: '每本练习本3元，买6本多少钱？', answer: '18', steps: '3×6=18元' },
            { type: 'apply', question: '63本书平均分给9个小朋友，每人几本？', answer: '7', steps: '63÷9=7本' },
            { type: 'apply', question: '边长5米的正方形花园，周长多少米？', answer: '20', steps: '5×4=20米' },
            { type: 'apply', question: '一打鸡蛋12个，3打多少个？', answer: '36', steps: '12×3=36个' },
            { type: 'apply', question: '45颗星星，每5颗圈一圈，可以圈几圈？', answer: '9', steps: '45÷5=9圈' },
            { type: 'apply', question: '长6米，宽4米的长方形，面积是多少？', answer: '24', steps: '6×4=24平方米' },
            { type: 'apply', question: '每箱18瓶饮料，3箱多少瓶？', answer: '54', steps: '18×3=54瓶' },
            { type: 'apply', question: '70颗糖平均分给10个小朋友，每人几颗？', answer: '7', steps: '70÷10=7颗' },
            { type: 'apply', question: '正方形边长12厘米，周长多少厘米？', answer: '48', steps: '12×4=48厘米' },
            { type: 'apply', question: '每袋4千克大米，5袋多少千克？', answer: '20', steps: '4×5=20千克' },
            { type: 'apply', question: '36个橘子，每6个装一盘，可以装几盘？', answer: '6', steps: '36÷6=6盘' },
            { type: 'apply', question: '长9分米，宽3分米的长方形周长是多少？', answer: '24', steps: '2×(9+3)=24分米' },
            { type: 'apply', question: '一包饼干5元，买7包多少元？', answer: '35', steps: '5×7=35元' }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let correctAnswers = 0;
        let wrongAnswers = 0;

        // 初始化
        function init() {
            renderQuestionSelect();
            loadQuestion(0);
        }

        // 渲染下拉选择器
        function renderQuestionSelect() {
            const select = document.getElementById('questionSelect');
            if (!select) return;
            
            select.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `第${i + 1}题`;
                
                if (i === currentQuestion) {
                    option.selected = true;
                    option.style.fontWeight = 'bold';
                    option.style.color = '#6366f1';
                } else if (answers[i] !== null) {
                    option.style.color = answers[i] ? '#10b981' : '#ef4444';
                }
                
                select.appendChild(option);
            }
        }

        // 跳转到指定题目
        function jumpToQuestion(index) {
            loadQuestion(parseInt(index));
        }

        // 加载题目
        function loadQuestion(index) {
            currentQuestion = index;
            const q = questions[index];
            
            document.getElementById('questionText').textContent = `第${index + 1}题：${q.question}`;
            document.getElementById('currentNum').textContent = index + 1;
            
            const optionsContainer = document.getElementById('optionsContainer');
            const answerSection = document.getElementById('answerSection');
            const feedback = document.getElementById('feedback');
            
            feedback.style.display = 'none';
            
            if (q.type === 'concept') {
                optionsContainer.style.display = 'grid';
                answerSection.style.display = 'none';
                optionsContainer.innerHTML = '';
                
                q.options.forEach((opt, i) => {
                    const div = document.createElement('div');
                    div.className = 'option';
                    div.textContent = opt;
                    
                    if (answers[index] !== null) {
                        div.disabled = true;
                        if (i === q.correct) {
                            div.classList.add('correct');
                        } else if (answers[index] === opt) {
                            div.classList.add('wrong');
                        }
                    } else {
                        div.onclick = () => selectOption(i, q);
                    }
                    
                    optionsContainer.appendChild(div);
                });
            } else {
                optionsContainer.style.display = 'none';
                answerSection.style.display = 'block';
                
                const input = document.getElementById('answerInput');
                input.value = answers[index] !== null ? (answers[index].toString()) : '';
                input.disabled = answers[index] !== null;
                
                if (answers[index] !== null) {
                    showFeedback(q, answers[index]);
                }
            }
            
            renderQuestionSelect();
            updateStats();
            
            // 更新按钮状态
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === questions.length - 1;
        }

        // 选择选项
        function selectOption(index, q) {
            const selected = q.options[index];
            const isCorrect = index === q.correct;
            
            answers[currentQuestion] = isCorrect;
            
            if (isCorrect) {
                correctAnswers++;
            } else {
                wrongAnswers++;
            }
            
            // 显示所有选项状态
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.disabled = true;
                if (i === q.correct) {
                    opt.classList.add('correct');
                } else if (i === index && !isCorrect) {
                    opt.classList.add('wrong');
                }
            });
            
            showFeedback(q, selected);
            renderQuestionSelect();
            updateStats();
        }

        // 显示反馈
        function showFeedback(q, userAnswer) {
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            
            if (q.type === 'concept') {
                const isCorrect = answers[currentQuestion] === true;
                feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
                feedback.innerHTML = isCorrect ? 
                    '✅ 正确！' + q.reason : 
                    '❌ 错误。正确答案：' + q.options[q.correct] + '<br>' + q.reason;
            } else {
                const isCorrect = userAnswer === q.answer;
                feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
                feedback.innerHTML = isCorrect ? 
                    '✅ 正确！' + (q.steps ? '解析：' + q.steps : '') : 
                    '❌ 错误。正确答案：' + q.answer + (q.steps ? '<br>解析：' + q.steps : '');
            }
        }

        // 检查答案（应用题）
        function checkAnswer() {
            if (answers[currentQuestion] !== null) return;
            
            const q = questions[currentQuestion];
            const input = document.getElementById('answerInput');
            const answer = input.value.trim();
            
            if (!answer) {
                alert('请先输入答案！');
                return;
            }
            
            const isCorrect = answer === q.answer;
            answers[currentQuestion] = isCorrect;
            
            if (isCorrect) {
                correctAnswers++;
            } else {
                wrongAnswers++;
            }
            
            input.disabled = true;
            showFeedback(q, answer);
            renderQuestionSelect();
            updateStats();
        }

        // 上一题
        function prevQuestion() {
            if (currentQuestion > 0) {
                loadQuestion(currentQuestion - 1);
            }
        }

        // 下一题
        function nextQuestion() {
            // 如果是应用题且未作答，先检查
            const q = questions[currentQuestion];
            if (q.type === 'apply' && answers[currentQuestion] === null) {
                checkAnswer();
            }
            
            if (currentQuestion < questions.length - 1) {
                loadQuestion(currentQuestion + 1);
            }
        }

        // 更新统计
        function updateStats() {
            const answered = answers.filter(a => a !== null).length;
            const percent = Math.round((answered / questions.length) * 100);
            
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressFill').textContent = percent + '%';
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('wrongCount').textContent = wrongAnswers;
            
            const accuracy = answered > 0 ? Math.round((correctAnswers / answered) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        // 监听回车键
        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // 启动
        window.onload = init;
    </script>
</body>
</html>
