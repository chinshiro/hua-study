<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="小学英语跟读填空练习，覆盖三到六年级共100个句子。" />
  <title>乐学英语 · 句子填空跟读</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>乐学英语</h1>
          <p>看中文 · 填英文 · 开口读</p>
        </div>
      </div>

      <div class="topbar-right">
        <span class="grade-badge" id="gradeBadge">三年级</span>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span>已掌握</span>
            <span><strong id="currentNum">0</strong> / <span id="totalNum">100</span></span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="1" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <button class="icon-btn" id="soundToggle" type="button" aria-label="关闭音效" title="音效开关">
          <svg class="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="icon-sound-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- 主内容 -->
    <main class="main">
      <section class="card" aria-labelledby="chineseSentence">
        <div class="card-top">
          <span class="step-label"><span class="step-dot"></span> 看中文，写出英文句子</span>
          <button class="speak-btn" id="speakBtn" type="button" title="听完整句子发音">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            听发音
          </button>
        </div>

        <h2 class="chinese-sentence" id="chineseSentence">你好吗？</h2>

        <div class="input-area" id="inputArea" role="group" aria-label="英文单词填空"></div>

        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

        <div class="actions">
          <button class="btn btn-primary" id="checkBtn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            检查答案
          </button>
          <button class="btn btn-ghost" id="hintBtn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
            提示
          </button>
          <button class="btn btn-ghost" id="resetBtn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            重写
          </button>
        </div>

        <p class="tip">小提示：单词输入正确会自动跳到下一格，全部填完自动检查；按 <kbd>空格</kbd> 也可跳格</p>
      </section>
    </main>

    <!-- 底部导航 -->
    <footer class="bottombar">
      <button class="nav-btn" id="shuffleBtn" type="button" title="随机换一句未做过的句子">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        换一句
      </button>
      <span class="memory-hint">做过的会自动跳过，直到清除记忆</span>
      <button class="nav-btn nav-clear" id="clearBtn" type="button" title="清除已做记录，重新开始随机练习">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        清除记忆
      </button>
    </footer>
  </div>

  <!-- 完成弹层 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-emoji" aria-hidden="true">🏆</div>
      <h2 id="modalTitle">太棒了，全部完成！</h2>
      <p>你已经完成了全部 100 个句子的练习，英语棒棒哒！</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalClose" type="button">继续练习</button>
        <button class="btn btn-primary" id="modalRestart" type="button">从头再来</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
