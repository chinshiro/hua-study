<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>益智游戏乐园 🎮</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --primary-dark: #E05555;
      --secondary: #4ECDC4;
      --secondary-dark: #3DB8B0;
      --accent-yellow: #FFE66D;
      --accent-purple: #A78BFA;
      --accent-green: #6BCB77;
      --accent-blue: #4D96FF;
      --accent-orange: #FF9F43;
      --accent-pink: #FF6BB5;
      --bg-main: #FFF9E6;
      --bg-card: #FFFFFF;
      --bg-category: #F0F4FF;
      --text-primary: #2D3436;
      --text-secondary: #636E72;
      --text-light: #FFFFFF;
      --shadow-soft: 0 4px 15px rgba(0,0,0,0.1);
      --shadow-card: 0 6px 20px rgba(0,0,0,0.12);
      --shadow-hover: 0 10px 30px rgba(0,0,0,0.18);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent-orange) 100%);
      padding: 20px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-soft);
    }

    .header h1 {
      color: var(--text-light);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      margin-top: 4px;
    }

    /* Category Filter */
    .filter-container {
      padding: 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--bg-card);
      border-bottom: 2px solid #f0f0f0;
    }

    .filter-container::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      background: var(--bg-category);
      color: var(--text-secondary);
    }

    .filter-btn.active {
      background: var(--primary);
      color: var(--text-light);
      box-shadow: 0 4px 12px rgba(255,107,107,0.4);
    }

    .filter-btn:hover:not(.active) {
      background: #e0e7ff;
      transform: translateY(-2px);
    }

    /* Game Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 20px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    @media (min-width: 480px) {
      .game-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 768px) {
      .game-grid {
        grid-template-columns: repeat(4, 1fr);
        padding: 30px;
      }
    }

    /* Game Card */
    .game-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--card-accent, var(--primary));
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .game-card:active {
      transform: translateY(-2px);
    }

    .game-card.hidden {
      display: none;
    }

    .game-icon {
      font-size: 42px;
      margin-bottom: 10px;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .game-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .game-category-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      background: var(--card-accent, var(--primary));
    }

    .game-score {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* Game Container Overlay */
    .game-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-main);
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .game-overlay.active {
      display: flex;
    }

    .game-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent-orange) 100%);
      color: var(--text-light);
      box-shadow: var(--shadow-soft);
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: var(--text-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .game-title {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .game-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }

    /* Category Colors */
    .cat-math { --card-accent: var(--accent-blue); }
    .cat-memory { --card-accent: var(--accent-green); }
    .cat-logic { --card-accent: var(--accent-purple); }
    .cat-chinese { --card-accent: var(--accent-pink); }
    .cat-space { --card-accent: var(--secondary); }
    .cat-reaction { --card-accent: var(--accent-orange); }
    .cat-comprehensive { --card-accent: var(--accent-yellow); }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(107, 203, 119, 0.4); }
      50% { box-shadow: 0 0 0 15px rgba(107, 203, 119, 0); }
    }

    .game-card {
      animation: fadeIn 0.4s ease-out forwards;
    }

    .game-card:nth-child(1) { animation-delay: 0.02s; }
    .game-card:nth-child(2) { animation-delay: 0.04s; }
    .game-card:nth-child(3) { animation-delay: 0.06s; }
    .game-card:nth-child(4) { animation-delay: 0.08s; }
    .game-card:nth-child(5) { animation-delay: 0.10s; }
    .game-card:nth-child(6) { animation-delay: 0.12s; }
    .game-card:nth-child(7) { animation-delay: 0.14s; }
    .game-card:nth-child(8) { animation-delay: 0.16s; }
    .game-card:nth-child(9) { animation-delay: 0.18s; }
    .game-card:nth-child(10) { animation-delay: 0.20s; }

    /* Game Common Styles */
    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-pink) 100%);
      color: white;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .hud-item {
      text-align: center;
    }

    .hud-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .hud-value {
      font-size: 24px;
      font-weight: 800;
    }

    .game-instruction {
      text-align: center;
      padding: 16px;
      background: var(--bg-category);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .game-question {
      text-align: center;
      margin: 20px 0;
    }

    .big-char {
      font-size: 72px;
      font-weight: 800;
      color: var(--text-primary);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .answer-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .answer-btn {
      padding: 20px;
      border: 3px solid transparent;
      border-radius: var(--radius-md);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
    }

    .answer-btn:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-hover);
    }

    .answer-btn:active {
      transform: scale(0.98);
    }

    .answer-btn.correct {
      background: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
      animation: pulse 0.5s;
    }

    .answer-btn.wrong {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      animation: shake 0.5s;
    }

    .word-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .word-char {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-card);
    }

    .word-char.highlight {
      background: var(--accent-yellow);
      color: var(--text-primary);
    }

    .word-input {
      width: 60px;
      height: 50px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      border: 3px dashed var(--accent-purple);
      border-radius: var(--radius-sm);
      background: var(--bg-category);
      caret-color: var(--accent-purple);
    }

    .word-input:focus {
      outline: none;
      border-style: solid;
      border-color: var(--accent-purple);
    }

    .next-btn {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 20px auto;
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--secondary) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-card);
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .result-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .result-score {
      font-size: 64px;
      font-weight: 800;
      color: var(--accent-green);
      margin: 20px 0;
    }

    .result-label {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .new-high {
      color: var(--accent-orange);
      font-size: 16px;
      font-weight: 700;
      animation: bounce 0.5s infinite;
    }

    /* Word Chain Specific */
    .chain-word {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent-purple);
      text-align: center;
      margin: 10px 0;
    }

    .chain-input-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    .chain-input {
      width: 200px;
      padding: 14px 20px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      border: 3px solid var(--accent-purple);
      border-radius: var(--radius-md);
      background: var(--bg-card);
    }

    .chain-input:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.3);
    }

    .chain-submit {
      padding: 14px 28px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .chain-submit:hover {
      background: var(--primary);
    }

    /* Pinyin Match Specific */
    .pinyin-container {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 20px 0;
    }

    .pinyin-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pinyin-item {
      padding: 16px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      border: 3px solid transparent;
    }

    .pinyin-item:hover {
      transform: scale(1.05);
    }

    .pinyin-item.selected {
      border-color: var(--accent-purple);
      background: var(--bg-category);
    }

    .pinyin-item.matched {
      background: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
    }

    .pinyin-item.wrong-match {
      animation: shake 0.5s;
      border-color: var(--primary);
    }

    /* Stroke Order Specific */
    .stroke-canvas-container {
      position: relative;
      margin: 20px auto;
      width: 200px;
      height: 200px;
    }

    .stroke-target {
      font-size: 140px;
      font-weight: 800;
      text-align: center;
      color: var(--text-primary);
      opacity: 0.1;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .stroke-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid var(--accent-purple);
      border-radius: var(--radius-md);
      background: white;
    }

    .stroke-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .stroke-btn {
      width: 60px;
      height: 60px;
      font-size: 24px;
      font-weight: 700;
      border: 2px solid var(--accent-purple);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      cursor: pointer;
      transition: var(--transition);
    }

    .stroke-btn:hover {
      background: var(--bg-category);
      transform: scale(1.1);
    }

    .stroke-btn.used {
      opacity: 0.3;
      pointer-events: none;
    }

    .stroke-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0;
    }

    .stroke-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg-category);
      border: 2px solid var(--accent-purple);
    }

    .stroke-dot.completed {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }

    /* Idiom Fill Specific */
    .idiom-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .idiom-char-box {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-card);
      border: 2px solid transparent;
    }

    .idiom-char-box.missing {
      border: 3px dashed var(--accent-orange);
      background: var(--bg-category);
    }

    .idiom-char-box.filled {
      background: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
    }

    .idiom-char-box.wrong-filled {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Homophone Specific */
    .homophone-context {
      font-size: 20px;
      text-align: center;
      padding: 20px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      margin: 20px 0;
      line-height: 1.8;
      box-shadow: var(--shadow-card);
    }

    .homophone-blank {
      display: inline-block;
      min-width: 40px;
      border-bottom: 3px solid var(--accent-purple);
      margin: 0 4px;
    }

    /* Feedback Toast */
    .feedback-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      border-radius: var(--radius-lg);
      font-size: 24px;
      font-weight: 800;
      color: white;
      z-index: 2000;
      animation: fadeIn 0.3s ease-out;
      pointer-events: none;
    }

    .feedback-toast.correct {
      background: var(--accent-green);
    }

    .feedback-toast.wrong {
      background: var(--primary);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- Main Menu -->
  <div id="mainMenu">
    <header class="header">
      <h1>🎮 益智游戏乐园</h1>
      <p>专为小学生设计的趣味益智游戏</p>
    </header>

    <div class="filter-container">
      <button class="filter-btn active" data-category="all">全部</button>
      <button class="filter-btn" data-category="math">🧮 数学</button>
      <button class="filter-btn" data-category="memory">🐾 记忆</button>
      <button class="filter-btn" data-category="logic">🟦 逻辑</button>
      <button class="filter-btn" data-category="chinese">📝 语文</button>
      <button class="filter-btn" data-category="space">🧩 空间</button>
      <button class="filter-btn" data-category="reaction">🎯 反应</button>
      <button class="filter-btn" data-category="comprehensive">🏃 综合</button>
    </div>

    <main class="game-grid" id="gameGrid">
      <!-- Game cards will be inserted here by JavaScript -->
    </main>

    <footer class="footer">
      <p>© 2026 益智游戏乐园 | 寓教于乐，快乐学习</p>
    </footer>
  </div>

  <!-- Game Overlay -->
  <div class="game-overlay" id="gameOverlay">
    <div class="game-header">
      <button class="back-btn" id="backBtn">
        <span>←</span> 返回
      </button>
      <h2 class="game-title" id="gameTitle">游戏名称</h2>
      <div style="width: 60px;"></div>
    </div>
    <div class="game-content" id="gameContent">
      <!-- Game content will be loaded here -->
    </div>
  </div>

  <script>
    // ==========================================
    // Game Data Configuration
    // ==========================================
    const games = [
      // Math Games (6)
      { id: 'mental-calc', name: '心算闯关', icon: '🧮', category: 'math', catClass: 'cat-math' },
      { id: 'number-fill', name: '数字填空', icon: '🔢', category: 'math', catClass: 'cat-math' },
      { id: 'equation-match', name: '等式匹配', icon: '⚖️', category: 'math', catClass: 'cat-math' },
      { id: 'calc-race', name: '四则运算竞速', icon: '⚡', category: 'math', catClass: 'cat-math' },
      { id: 'number-compare', name: '数字比大小', icon: '🔍', category: 'math', catClass: 'cat-math' },
      { id: 'count-add', name: '连续加减', icon: '➕', category: 'math', catClass: 'cat-math' },
      // Memory Games (5)
      { id: 'animal-pairs', name: '动物翻牌', icon: '🐾', category: 'memory', catClass: 'cat-memory' },
      { id: 'color-match', name: '颜色配对', icon: '🎨', category: 'memory', catClass: 'cat-memory' },
      { id: 'emoji-memory', name: 'Emoji记忆', icon: '🃏', category: 'memory', catClass: 'cat-memory' },
      { id: 'number-seq', name: '数字序列复现', icon: '📊', category: 'memory', catClass: 'cat-memory' },
      { id: 'pattern-match', name: '图案找相同', icon: '🔗', category: 'memory', catClass: 'cat-memory' },
      // Logic Games (5)
      { id: 'sudoku', name: '数独入门', icon: '🟦', category: 'logic', catClass: 'cat-logic' },
      { id: 'logic-maze', name: '逻辑迷宫', icon: '🌀', category: 'logic', catClass: 'cat-logic' },
      { id: 'order-sort', name: '顺序排列', icon: '📏', category: 'logic', catClass: 'cat-logic' },
      { id: 'find-pattern', name: '找规律填数', icon: '🔮', category: 'logic', catClass: 'cat-logic' },
      { id: 'shape-reason', name: '图形推理', icon: '📐', category: 'logic', catClass: 'cat-logic' },
      // Chinese Games (5)
      { id: 'word-chain', name: '词语接龙', icon: '📝', category: 'chinese', catClass: 'cat-chinese' },
      { id: 'pinyin-match', name: '拼音配对', icon: '🔤', category: 'chinese', catClass: 'cat-chinese' },
      { id: 'stroke-order', name: '汉字笔画顺序', icon: '✍️', category: 'chinese', catClass: 'cat-chinese' },
      { id: 'idiom-fill', name: '成语填空', icon: '📖', category: 'chinese', catClass: 'cat-chinese' },
      { id: 'homophone', name: '同音字辨析', icon: '🎯', category: 'chinese', catClass: 'cat-chinese' },
      // Space Games (4)
      { id: 'tangram', name: '七巧板拼图', icon: '🧩', category: 'space', catClass: 'cat-space' },
      { id: 'rotate-match', name: '旋转匹配', icon: '🔄', category: 'space', catClass: 'cat-space' },
      { id: 'mirror-sym', name: '镜像对称', icon: '🪞', category: 'space', catClass: 'cat-space' },
      { id: 'shape-classify', name: '形状分类', icon: '🔷', category: 'space', catClass: 'cat-space' },
      // Reaction Games (3)
      { id: 'color-click', name: '颜色点击', icon: '🎯', category: 'reaction', catClass: 'cat-reaction' },
      { id: 'rhythm-tap', name: '节奏tap', icon: '🥁', category: 'reaction', catClass: 'cat-reaction' },
      { id: 'find-diff', name: '限时找不同', icon: '👀', category: 'reaction', catClass: 'cat-reaction' },

      { id: 'maze-walk', name: '迷宫行走', icon: '🏃', category: 'comprehensive', catClass: 'cat-comprehensive' },
      { id: 'maze-memory', name: '迷宫记忆路线', icon: '🧭', category: 'comprehensive', catClass: 'cat-comprehensive' },
    ];

    // Global reference to the currently-open game (used by restart buttons)
    let currentGame = null;

    // Track timers/intervals created by the open game so they can be stopped on close
    let gameTimers = [];
    function trackTimer(id) { gameTimers.push(id); return id; }
    function stopGameTimers() {
      gameTimers.forEach(t => { try { clearInterval(t); clearTimeout(t); } catch (e) {} });
      gameTimers = [];
    }

    // ==========================================
    // Score Management with localStorage
    // ==========================================
    const ScoreManager = {
      prefix: 'kidgame_score_',

      getScore(gameId) {
        const score = localStorage.getItem(this.prefix + gameId);
        return score ? parseInt(score, 10) : 0;
      },

      setScore(gameId, score) {
        localStorage.setItem(this.prefix + gameId, score.toString());
      },

      getHighScore(gameId) {
        const score = localStorage.getItem(this.prefix + gameId + '_high');
        return score ? parseInt(score, 10) : 0;
      },

      updateHighScore(gameId, score) {
        const currentHigh = this.getHighScore(gameId);
        if (score > currentHigh) {
          localStorage.setItem(this.prefix + gameId + '_high', score.toString());
          return true;
        }
        return false;
      },

      getAllScores() {
        const scores = {};
        games.forEach(g => {
          scores[g.id] = {
            score: this.getScore(g.id),
            highScore: this.getHighScore(g.id)
          };
        });
        return scores;
      }
    };

    // ==========================================
    // UI Rendering
    // ==========================================
    const gameGrid = document.getElementById('gameGrid');
    const mainMenu = document.getElementById('mainMenu');
    const gameOverlay = document.getElementById('gameOverlay');
    const gameTitle = document.getElementById('gameTitle');
    const gameContent = document.getElementById('gameContent');
    const backBtn = document.getElementById('backBtn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderGames(filter = 'all') {
      gameGrid.innerHTML = '';
      games.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = `game-card ${game.catClass}`;
        card.dataset.category = game.category;
        card.dataset.gameId = game.id;
        if (filter !== 'all' && game.category !== filter) {
          card.classList.add('hidden');
        }

        const highScore = ScoreManager.getHighScore(game.id);
        const scoreHtml = highScore > 0 ? `<div class="game-score">🏆 最高分: ${highScore}</div>` : '';

        card.innerHTML = `
          <span class="game-icon">${game.icon}</span>
          <div class="game-name">${game.name}</div>
          <span class="game-category-tag">${getCategoryName(game.category)}</span>
          ${scoreHtml}
        `;

        card.addEventListener('click', () => openGame(game));
        gameGrid.appendChild(card);
      });
    }

    function getCategoryName(cat) {
      const names = {
        math: '数学',
        memory: '记忆',
        logic: '逻辑',
        chinese: '语文',
        space: '空间',
        reaction: '反应',
        comprehensive: '综合'
      };
      return names[cat] || cat;
    }

    function openGame(game) {
      currentGame = game;
      gameTitle.textContent = game.icon + ' ' + game.name;
      gameContent.innerHTML = '';
      gameOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';

      // Load game-specific content
      loadGameContent(game);
    }

    function closeGame() {
      stopGameTimers();
      gameOverlay.classList.remove('active');
      document.body.style.overflow = '';
      gameContent.innerHTML = '';
      renderGames(currentFilter);
    }

    function restartGame() {
      if (currentGame) loadGameContent(currentGame);
    }

    function loadGameContent(game) {
      stopGameTimers();
      const gameInitFunctions = {
        // Math Games (6)
        'mental-calc': initMentalCalc,
        'number-fill': initNumberFill,
        'equation-match': initEquationMatch,
        'calc-race': initCalcRace,
        'number-compare': initNumberCompare,
        'count-add': initCountAdd,
        // Memory Games (5)
        'animal-pairs': initAnimalPairs,
        'color-match': initColorMatch,
        'emoji-memory': initEmojiMemory,
        'number-seq': initNumberSeq,
        'pattern-match': initPatternMatch,
        // Logic Games (5)
        'sudoku': initSudoku,
        'logic-maze': initLogicMaze,
        'order-sort': initOrderSort,
        'find-pattern': initFindPattern,
        'shape-reason': initShapeReason,
        // Chinese Games (5)
        'word-chain': initWordChain,
        'pinyin-match': initPinyinMatch,
        'stroke-order': initStrokeOrder,
        'idiom-fill': initIdiomFill,
        'homophone': initHomophone,
        // Space Games (4)
        'tangram': initTangram,
        'rotate-match': initRotateMatch,
        'mirror-sym': initMirrorSym,
        'shape-classify': initShapeClassify,
        // Reaction Games (3)
        'color-click': initColorClick,
        'rhythm-tap': initRhythmTap,
        'find-diff': initFindDiff,
        // Comprehensive Games (2)
        'maze-walk': initMazeWalk,
        'maze-memory': initMazeMemory
      };

      if (gameInitFunctions[game.id]) {
        gameInitFunctions[game.id](game);
      } else {
        gameContent.innerHTML = `
          <div style="text-align:center;padding:60px 20px;">
            <div style="font-size:80px;margin-bottom:20px;">${game.icon}</div>
            <h2 style="color:var(--text-primary);margin-bottom:12px;">${game.name}</h2>
            <p style="color:var(--text-secondary);font-size:14px;">游戏开发中...</p>
            <div style="margin-top:30px;padding:20px;background:var(--bg-category);border-radius:var(--radius-md);">
              <p style="font-size:13px;color:var(--text-secondary);">分类: ${getCategoryName(game.category)}</p>
              <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">最高分: ${ScoreManager.getHighScore(game.id) || '-'}</p>
            </div>
          </div>
        `;
      }
    }

    backBtn.addEventListener('click', closeGame);

    // ==========================================
    // Category Filter
    // ==========================================
    let currentFilter = 'all';

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.category;
        renderGames(currentFilter);
      });
    });

    // ==========================================
    // Utility Functions
    // ==========================================
    function showFeedback(isCorrect, message) {
      const toast = document.createElement('div');
      toast.className = `feedback-toast ${isCorrect ? 'correct' : 'wrong'}`;
      toast.textContent = message || (isCorrect ? '✓ 正确！' : '✗ 再想想');
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1000);
    }

    function shuffleArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // ==========================================
    // Game 1: Word Chain (词语接龙)
    // ==========================================
    function initWordChain(game) {
      const WORD_DATA = [
        { word: '天空', next: ['空气', '空气洞', '气球'] },
        { word: '大海', next: ['海洋', '洋气', '气球'] },
        { word: '花园', next: ['院子', '子女', '女生'] },
        { word: '苹果', next: ['和平', '平静', '静止'] },
        { word: '春天', next: ['天空', '空气', '气球'] },
        { word: '太阳', next: ['阳光', '光明', '明天'] },
        { word: '月亮', next: ['亮光', '光彩', '彩色'] },
        { word: '小鸟', next: ['羽毛', '毛发', '发现'] },
        { word: '大树', next: ['树叶', '叶子', '字数'] },
        { word: '山水', next: ['水面', '面积', '离开'] },
        { word: '读书', next: ['书本', '本领', '能力'] },
        { word: '学习', next: ['习惯', '惯性', '性格'] },
        { word: '朋友', next: ['友情', '情谊', '意思'] },
        { word: '快乐', next: ['乐意', '意外', '外面'] },
        { word: '吃饭', next: ['晚饭', '晚餐', '餐厅'] },
        { word: '睡觉', next: ['做梦', '梦想', '想到'] },
        { word: '游泳', next: ['游泳馆', '场馆', '广场'] },
        { word: '跑步', next: ['步调', '调整', '整齐'] },
        { word: '画画', next: ['画面', '面前', '前面'] },
        { word: '唱歌', next: ['歌曲', '歌词', '词语'] },
      ];

      let currentScore = 0;
      let currentRound = 0;
      let totalRounds = 10;
      let currentEndChar = '';
      let usedWords = new Set();
      let isWaiting = false;

      function startGame() {
        currentScore = 0;
        currentRound = 0;
        usedWords = new Set();
        const firstWord = WORD_DATA[Math.floor(Math.random() * WORD_DATA.length)];
        currentEndChar = firstWord.word[firstWord.word.length - 1];
        renderGame();
      }

      function renderGame() {
        gameContent.innerHTML = `
          <div class="game-hud">
            <div class="hud-item">
              <div class="hud-label">第几题</div>
              <div class="hud-value">${currentRound}/${totalRounds}</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">得分</div>
              <div class="hud-value">${currentScore}</div>
            </div>
          </div>
          <div class="game-instruction">
            💡 上一个词的最后一个字，作为下一个词的第一个字！
          </div>
          <div class="word-display">
            <div class="word-char highlight">${currentEndChar}</div>
          </div>
          <div style="text-align:center;color:var(--text-secondary);margin-bottom:10px;">
            请写出以「${currentEndChar}」开头的词语
          </div>
          <div class="chain-input-container">
            <input type="text" class="chain-input" id="wordInput" 
              placeholder="输入词语..." maxlength="6" autocomplete="off">
            <button class="chain-submit" id="submitBtn">提交 ✓</button>
          </div>
          <div id="feedbackArea"></div>
          <button class="next-btn" id="nextBtn" style="display:none;">下一题 →</button>
        `;

        const input = document.getElementById('wordInput');
        const submitBtn = document.getElementById('submitBtn');
        const nextBtn = document.getElementById('nextBtn');
        const feedbackArea = document.getElementById('feedbackArea');

        input.focus();

        submitBtn.addEventListener('click', () => checkWord(input.value.trim()));
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') checkWord(input.value.trim());
        });

        nextBtn.addEventListener('click', () => {
          currentRound++;
          if (currentRound >= totalRounds) {
            endGame();
          } else {
            nextRound();
          }
        });
      }

      function checkWord(word) {
        if (!word || word.length < 2) {
          showFeedback(false, '请输入至少2个字的词语');
          return;
        }
        if (word[0] !== currentEndChar) {
          showFeedback(false, `词语需要以「${currentEndChar}」开头`);
          return;
        }
        if (usedWords.has(word)) {
          showFeedback(false, '这个词语已经用过了，换一个吧！');
          return;
        }

        usedWords.add(word);
        currentScore += 10;
        showFeedback(true, '✓ 答对了！+10分');

        const feedbackArea = document.getElementById('feedbackArea');
        if (feedbackArea) feedbackArea.innerHTML = `<div style="text-align:center;padding:10px;color:var(--accent-green);font-weight:700;">「${word}」✓</div>`;

        const submitEl = document.getElementById('submitBtn');
        if (submitEl) submitEl.style.display = 'none';
        const inputEl = document.getElementById('wordInput');
        if (inputEl) inputEl.disabled = true;
        currentEndChar = word[word.length - 1];

        // Show next hint
        const wordDisplay = document.querySelector('.word-display');
        if (wordDisplay) wordDisplay.innerHTML = `<div class="word-char highlight">${currentEndChar}</div>`;

        const nextEl = document.getElementById('nextBtn');
        if (nextEl) {
          nextEl.style.display = 'block';
          nextEl.focus();
        }
      }

      function nextRound() {
        // Generate a random word starting with currentEndChar
        const candidates = WORD_DATA.filter(w => w.word[0] === currentEndChar);
        if (candidates.length > 0) {
          const next = candidates[Math.floor(Math.random() * candidates.length)];
          currentEndChar = next.word[next.word.length - 1];
        } else {
          currentEndChar = '天'; // fallback
        }
        renderGame();
      }

      function endGame() {
        const isNewHigh = ScoreManager.updateHighScore(game.id, currentScore);
        gameContent.innerHTML = `
          <div class="result-screen">
            <div style="font-size:60px;margin-bottom:20px;">🎉</div>
            <div class="result-label">游戏结束！</div>
            <div class="result-score">${currentScore}</div>
            <div class="result-label">最终得分</div>
            ${isNewHigh ? '<div class="new-high">🏆 新纪录！</div>' : ''}
            <div style="margin-top:10px;color:var(--text-secondary);">
              最高分: ${ScoreManager.getHighScore(game.id)}
            </div>
            <button class="next-btn" onclick="restartGame()" style="margin-top:30px;">
              再来一局 🔄
            </button>
          </div>
        `;
      }

      startGame();
    }

    // ==========================================
    // Game 2: Pinyin Match (拼音配对)
    // ==========================================
    function initPinyinMatch(game) {
      const PAIRS = [
        { char: '日', pinyin: 'rì' },
        { char: '月', pinyin: 'yuè' },
        { char: '山', pinyin: 'shān' },
        { char: '水', pinyin: 'shuǐ' },
        { char: '火', pinyin: 'huǒ' },
        { char: '土', pinyin: 'tǔ' },
        { char: '木', pinyin: 'mù' },
        { char: '花', pinyin: 'huā' },
        { char: '草', pinyin: 'cǎo' },
        { char: '风', pinyin: 'fēng' },
        { char: '雨', pinyin: 'yǔ' },
        { char: '雪', pinyin: 'xuě' },
        { char: '云', pinyin: 'yún' },
        { char: '星', pinyin: 'xīng' },
        { char: '天', pinyin: 'tiān' },
        { char: '地', pinyin: 'dì' },
      ];

      let matchedPairs = 0;
      let totalPairs = 8;
      let selectedChar = null;
      let selectedPinyin = null;
      let isProcessing = false;

      function startGame() {
        matchedPairs = 0;
        selectedChar = null;
        selectedPinyin = null;
        isProcessing = false;

        // Pick random pairs
        const shuffledPairs = shuffleArray(PAIRS).slice(0, totalPairs);
        const chars = shuffleArray(shuffledPairs.map(p => ({ ...p, type: 'char' })));
        const pinyins = shuffleArray(shuffledPairs.map(p => ({ ...p, type: 'pinyin', correct: p.char })));

        renderGame(chars, pinyins);
      }

      function renderGame(chars, pinyins) {
        const charHTML = chars.map((item, i) => `
                <div class="pinyin-item" data-type="char" data-char="${item.char}" data-index="${i}">
                  ${item.char}
                </div>
              `).join('');
        const pinyinHTML = pinyins.map((item, i) => `
                <div class="pinyin-item" data-type="pinyin" data-pinyin="${item.pinyin}" data-correct="${item.correct}" data-index="${i}">
                  ${item.pinyin}
                </div>
              `).join('');

        gameContent.innerHTML = `
          <div class="game-hud">
            <div class="hud-item">
              <div class="hud-label">已配对</div>
              <div class="hud-value">${matchedPairs}/${totalPairs}</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">得分</div>
              <div class="hud-value" id="scoreValue">0</div>
            </div>
          </div>
          <div class="game-instruction">
            💡 点击汉字，再点击对应的拼音完成配对！
          </div>
          <div class="pinyin-container">
            <div class="pinyin-column" id="charColumn">
              ${charHTML}
            </div>
            <div class="pinyin-column" id="pinyinColumn">
              ${pinyinHTML}
            </div>
          </div>
        `;

        const charItems = document.querySelectorAll('[data-type="char"]');
        const pinyinItems = document.querySelectorAll('[data-type="pinyin"]');

        charItems.forEach(item => {
          item.addEventListener('click', () => {
            if (isProcessing || item.classList.contains('matched')) return;
            charItems.forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            selectedChar = item;
            tryMatch();
          });
        });

        pinyinItems.forEach(item => {
          item.addEventListener('click', () => {
            if (isProcessing || item.classList.contains('matched')) return;
            pinyinItems.forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            selectedPinyin = item;
            tryMatch();
          });
        });
      }

      function tryMatch() {
        if (!selectedChar || !selectedPinyin) return;
        isProcessing = true;

        const char = selectedChar.dataset.char;
        const pinyin = selectedPinyin.dataset.pinyin;
        const correctChar = selectedPinyin.dataset.correct;

        if (char === correctChar) {
          // Correct match
          selectedChar.classList.add('matched');
          selectedPinyin.classList.add('matched');
          matchedPairs++;
          const scoreEl = document.getElementById('scoreValue');
          scoreEl.textContent = matchedPairs * 10;
          showFeedback(true, '✓ 配对成功！');

          if (matchedPairs >= totalPairs) {
            trackTimer(setTimeout(endGame, 500));
          }
        } else {
          // Wrong match
          selectedChar.classList.add('wrong-match');
          selectedPinyin.classList.add('wrong-match');
          showFeedback(false, '✗ 不对哦，再试试！');

          trackTimer(setTimeout(() => {
            selectedChar.classList.remove('selected', 'wrong-match');
            selectedPinyin.classList.remove('selected', 'wrong-match');
            isProcessing = false;
            selectedChar = null;
            selectedPinyin = null;
          }, 600));
          return;
        }

        selectedChar = null;
        selectedPinyin = null;
        isProcessing = false;
      }

      function endGame() {
        const finalScore = matchedPairs * 10;
        const isNewHigh = ScoreManager.updateHighScore(game.id, finalScore);
        gameContent.innerHTML = `
          <div class="result-screen">
            <div style="font-size:60px;margin-bottom:20px;">🎉</div>
            <div class="result-label">全部配对完成！</div>
            <div class="result-score">${finalScore}</div>
            <div class="result-label">最终得分</div>
            ${isNewHigh ? '<div class="new-high">🏆 新纪录！</div>' : ''}
            <div style="margin-top:10px;color:var(--text-secondary);">
              最高分: ${ScoreManager.getHighScore(game.id)}
            </div>
            <button class="next-btn" style="margin-top:30px;" onclick="restartGame()">
              再来一局 🔄
            </button>
          </div>
        `;
      }

      startGame();
    }

    // ==========================================
    // Game 3: Stroke Order (汉字笔画顺序)
    // ==========================================
    function initStrokeOrder(game) {
      // Simplified stroke data for common characters
      const STROKE_DATA = {
        '大': { strokes: ['横', '撇', '捺'], pinyin: 'dà', meaning: 'big' },
        '小': { strokes: ['竖钩', '撇', '点'], pinyin: 'xiǎo', meaning: 'small' },
        '上': { strokes: ['竖', '横', '横'], pinyin: 'shàng', meaning: 'up' },
        '下': { strokes: ['横', '竖', '点'], pinyin: 'xià', meaning: 'down' },
        '中': { strokes: ['竖', '横折', '横', '竖'], pinyin: 'zhōng', meaning: 'middle' },
        '天': { strokes: ['横', '横', '撇', '捺'], pinyin: 'tiān', meaning: 'sky' },
        '人': { strokes: ['撇', '捺'], pinyin: 'rén', meaning: 'person' },
        '口': { strokes: ['竖', '横折', '横'], pinyin: 'kǒu', meaning: 'mouth' },
        '日': { strokes: ['竖', '横折', '横', '横'], pinyin: 'rì', meaning: 'sun' },
        '月': { strokes: ['撇', '横折钩', '横', '横'], pinyin: 'yuè', meaning: 'moon' },
        '水': { strokes: ['竖钩', '横撇', '撇', '捺'], pinyin: 'shuǐ', meaning: 'water' },
        '火': { strokes: ['点', '撇', '撇', '捺'], pinyin: 'huǒ', meaning: 'fire' },
        '山': { strokes: ['竖', '竖折', '竖'], pinyin: 'shān', meaning: 'mountain' },
        '石': { strokes: ['横', '撇', '竖', '横折', '横'], pinyin: 'shí', meaning: 'stone' },
        '田': { strokes: ['竖', '横折', '横', '竖', '横'], pinyin: 'tián', meaning: 'field' },
      };

      let currentChar = '';
      let currentStrokeIndex = 0;
      let currentScore = 0;
      let totalQuestions = 8;
      let questionCount = 0;
      let strokeOrder = [];

      function startGame() {
        currentScore = 0;
        questionCount = 0;
        nextQuestion();
      }

      function nextQuestion() {
        if (questionCount >= totalQuestions) {
          endGame();
          return;
        }

        const charKeys = Object.keys(STROKE_DATA);
        currentChar = charKeys[Math.floor(Math.random() * charKeys.length)];
        strokeOrder = STROKE_DATA[currentChar].strokes;
        currentStrokeIndex = 0;

        renderQuestion();
      }

      function renderQuestion() {
        const strokeInfo = STROKE_DATA[currentChar];
        const displayOrder = strokeOrder.map((_, i) => i);
        for (let i = displayOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [displayOrder[i], displayOrder[j]] = [displayOrder[j], displayOrder[i]];
        }
        const strokeOptionsHtml = displayOrder.map(i =>
          `<button class='stroke-btn' data-stroke='${i}'>${strokeOrder[i]}</button>`
        ).join('');
        const strokeProgressHtml = strokeOrder.map((_, i) =>
          `<div class='stroke-dot' id='dot-${i}'></div>`
        ).join('');

        gameContent.innerHTML = `
          <div class="game-hud">
            <div class="hud-item">
              <div class="hud-label">第几题</div>
              <div class="hud-value">${questionCount + 1}/${totalQuestions}</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">得分</div>
              <div class="hud-value">${currentScore}</div>
            </div>
          </div>
          <div class="game-instruction">
            💡 请按正确的笔画顺序点击，组成汉字「${currentChar}」(${strokeInfo.pinyin})
          </div>
          <div class="stroke-canvas-container">
            <div class="stroke-target">${currentChar}</div>
            <canvas class="stroke-canvas" id="strokeCanvas" width="200" height="200"></canvas>
          </div>
          <div class="stroke-progress" id="strokeProgress">${strokeProgressHtml}</div>
          <div class="stroke-options" id="strokeOptions">${strokeOptionsHtml}</div>
          <div id="strokeFeedback" style="text-align:center;font-size:18px;font-weight:700;height:30px;"></div>
        `;

        const buttons = document.querySelectorAll('.stroke-btn');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => checkStroke(parseInt(btn.dataset.stroke)));
        });
      }

      function checkStroke(strokeIndex) {
        const feedbackEl = document.getElementById('strokeFeedback');
        const expectedStroke = strokeOrder[currentStrokeIndex];
        const actualStroke = STROKE_DATA[currentChar].strokes[strokeIndex];

        if (strokeIndex === currentStrokeIndex) {
          // Correct stroke
          currentStrokeIndex++;
          document.getElementById(`dot-${strokeIndex}`).classList.add('completed');

          // Draw stroke on canvas
          drawStrokeOnCanvas(strokeIndex);

          if (currentStrokeIndex >= strokeOrder.length) {
            // Completed the character!
            currentScore += 15;
            feedbackEl.innerHTML = '<span style="color:var(--accent-green);">✓ 太棒了！正确写出「' + currentChar + '」</span>';
            showFeedback(true, '✓ 完美！');

            trackTimer(setTimeout(() => {
              questionCount++;
              nextQuestion();
            }, 1500));
          } else {
            feedbackEl.innerHTML = '<span style="color:var(--accent-green);">✓ 正确！继续</span>';
            trackTimer(setTimeout(() => {
              feedbackEl.innerHTML = '';
            }, 500));
          }
        } else {
          // Wrong stroke
          feedbackEl.innerHTML = `<span style="color:var(--primary);">✗ 不对哦，应该先写「${expectedStroke}」</span>`;
          showFeedback(false, '✗ 再想想');

          trackTimer(setTimeout(() => {
            feedbackEl.innerHTML = '';
          }, 1000));
        }
      }

      function drawStrokeOnCanvas(strokeIndex) {
        const canvas = document.getElementById('strokeCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#A78BFA';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        // Simple visual representation of strokes
        const char = currentChar;
        const x = 100, y = 100;

        ctx.beginPath();
        switch(char) {
          case '大':
            if (strokeIndex === 0) { // horizontal
              ctx.moveTo(x - 50, y - 20);
              ctx.lineTo(x + 50, y - 20);
            } else if (strokeIndex === 1) { // left sweep
              ctx.moveTo(x, y - 30);
              ctx.quadraticCurveTo(x - 20, y + 30, x - 50, y + 60);
            } else { // right sweep
              ctx.moveTo(x, y - 30);
              ctx.quadraticCurveTo(x + 20, y + 30, x + 50, y + 60);
            }
            break;
          case '小':
            if (strokeIndex === 0) { // vertical hook
              ctx.moveTo(x, y - 50);
              ctx.lineTo(x, y + 30);
              ctx.quadraticCurveTo(x - 10, y + 50, x - 20, y + 40);
            } else if (strokeIndex === 1) { // left dot
              ctx.moveTo(x - 10, y - 10);
              ctx.quadraticCurveTo(x - 30, y + 10, x - 40, y + 20);
            } else { // right dot
              ctx.moveTo(x + 10, y - 10);
              ctx.quadraticCurveTo(x + 30, y + 10, x + 40, y + 20);
            }
            break;
          case '上':
            if (strokeIndex === 0) { // vertical
              ctx.moveTo(x + 30, y - 40);
              ctx.lineTo(x + 30, y - 10);
            } else if (strokeIndex === 1) { // horizontal
              ctx.moveTo(x - 40, y - 10);
              ctx.lineTo(x + 50, y - 10);
            } else { // bottom horizontal
              ctx.moveTo(x - 50, y + 30);
              ctx.lineTo(x + 40, y + 30);
            }
            break;
          case '下':
            if (strokeIndex === 0) { // horizontal
              ctx.moveTo(x - 40, y - 30);
              ctx.lineTo(x + 40, y - 30);
            } else if (strokeIndex === 1) { // vertical
              ctx.moveTo(x + 10, y - 40);
              ctx.lineTo(x + 10, y + 40);
            } else { // dot
              ctx.moveTo(x - 20, y + 10);
              ctx.quadraticCurveTo(x - 30, y + 30, x - 20, y + 35);
            }
            break;
          default:
            // Generic circle for unknown strokes
            ctx.arc(x, y, 30, 0, Math.PI * 2);
        }
        ctx.stroke();
      }

      function endGame() {
        const isNewHigh = ScoreManager.updateHighScore(game.id, currentScore);
        gameContent.innerHTML = `
          <div class="result-screen">
            <div style="font-size:60px;margin-bottom:20px;">✍️</div>

              <div class="hud-value" id="timer">${timeLeft}s</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">🎯 得分</div>
              <div class="hud-value" id="score">${score}</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">🏆 最高</div>
              <div class="hud-value">${ScoreManager.getHighScore(game.id)}</div>
            </div>
          </div>
          <div class="game-instruction">
            👉 点击与<strong style="color:var(--primary)">文字颜色</strong>匹配的按钮！
          </div>
          <div id="gameArea" style="text-align:center;padding:20px;">
            <button class="game-btn large" id="startBtn">开始游戏</button>
          </div>
        `;

        document.getElementById('startBtn').addEventListener('click', startGame);
      }

      function startGame() {
        score = 0;
        timeLeft = 30;
        isPlaying = true;
        updateHUD();
        nextRound();

        timer = setInterval(() => {
          timeLeft--;
          updateHUD();
          if (timeLeft <= 0) endGame();
        }, 1000);
      }

      function nextRound() {
        const area = document.getElementById('gameArea');
        if (!area || !isPlaying) return;

        currentColor = COLORS[Math.floor(Math.random() * COLORS.length)];

        // Create 4 color buttons including the correct one
        const buttons = [currentColor];
        while (buttons.length < 4) {
          const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
          if (!buttons.find(b => b.name === randomColor.name)) {
            buttons.push(randomColor);
          }
        }
        buttons.sort(() => Math.random() - 0.5);

        area.innerHTML = `
          <div style="font-size: 32px; font-weight: 800; margin-bottom: 20px; padding: 20px; border-radius: var(--radius-md); background: var(--bg-card); box-shadow: var(--shadow-card);" id="colorDisplay">

        area.querySelectorAll('.answer-btn').forEach(btn => {

      function handleAnswer(answer) {
        if (!isPlaying) return;

        if (answer === currentColor.name) {
          score += 10;
          document.getElementById('colorDisplay').style.animation = 'pulse 0.3s';
        } else {
          score = Math.max(0, score - 5);
          document.getElementById('colorDisplay').style.animation = 'shake 0.3s';

        updateHUD();
        setTimeout(nextRound, 200);
      }

      function updateHUD() {
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        if (timerEl) timerEl.textContent = timeLeft + 's';
        if (scoreEl) scoreEl.textContent = score;
      }

      function endGame() {
        clearInterval(timer);
        isPlaying = false;

        const isNewHigh = ScoreManager.updateHighScore(game.id, score);
        gameContent.innerHTML = `

            <div style="font-size:60px;margin-bottom:20px;">🎯</div>

    // ==========================================
    // Game 7: Rhythm Tap (节奏tap) - 反应速度游戏
    // ==========================================
    function initRhythmTap(game) {
      let score = 0;
      let combo = 0;
      let maxCombo = 0;
      let timeLeft = 30;
      let timer = null;
      let beatTimer = null;
      let isPlaying = false;
      let currentBeat = 0;
      const BEAT_INTERVAL = 600; // ms

      function render() {
        gameContent.innerHTML = `
          <div class="game-hud">
            <div class="hud-item">
              <div class="hud-label">⏱️ 时间</div>
              <div class="hud-value" id="timer">${timeLeft}s</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">🎵 得分</div>
              <div class="hud-value" id="score">${score}</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">🔥 连击</div>
              <div class="hud-value" id="combo">0</div>
            </div>
          </div>
          <div class="game-instruction">
            👉 跟着节奏点击圆圈！保持连击获得高分！
          </div>
          <div style="text-align:center;padding:20px;">
            <div class="rhythm-circle" id="rhythmCircle" style="
              width: 200px;
              height: 200px;
              border-radius: 50%;
              margin: 30px auto;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 60px;
              cursor: pointer;
              transition: all 0.1s;
              background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
              box-shadow: 0 8px 30px rgba(77,150,255,0.4);
            ">🥁</div>
            <div class="rhythm-pattern" id="pattern" style="
              display: flex;
              justify-content: center;
              gap: 12px;
              margin: 20px 0;
            "></div>
            <button class="game-btn large" id="startBtn">开始游戏</button>
          </div>
        `;

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('rhythmCircle').addEventListener('click', handleTap);
        document.getElementById('rhythmCircle').addEventListener('touchstart', (e) => {
          e.preventDefault();
          handleTap();
        });
      }

      function startGame() {
        score = 0;
        combo = 0;
        maxCombo = 0;
        timeLeft = 30;
        isPlaying = true;
        currentBeat = 0;
        updateHUD();

        // Create pattern dots
        const pattern = document.getElementById('pattern');
        pattern.innerHTML = '';
        for (let i = 0; i < 8; i++) {
          pattern.innerHTML += '<div class="rhythm-dot" id="dot-' + i + '" style="width:20px;height:20px;border-radius:50%;background:#ddd;transition:all 0.2s;"></div>';
        }

        // Start beat
        beatTimer = setInterval(() => {
          if (!isPlaying) return;
          currentBeat = (currentBeat + 1) % 8;
          updatePattern();
        }, BEAT_INTERVAL);

        // Game timer
        timer = setInterval(() => {
          timeLeft--;
          updateHUD();
          if (timeLeft <= 0) endGame();
        }, 1000);
      }

      function updatePattern() {
        for (let i = 0; i < 8; i++) {
          const dot = document.getElementById('dot-' + i);
          if (dot) {
            dot.style.background = i === currentBeat ? 'var(--accent-blue)' : '#ddd';
            dot.style.transform = i === currentBeat ? 'scale(1.3)' : 'scale(1)';
          }
        }
      }

      function handleTap() {
        if (!isPlaying) return;

        const circle = document.getElementById('rhythmCircle');

        // Check if tap is on beat (within ±1 position)
        const diff = Math.abs(currentBeat - ((currentBeat + 7) % 8));
        if (diff <= 1) {
          combo++;
          maxCombo = Math.max(maxCombo, combo);
          score += 10 + combo * 2;
          circle.style.background = 'linear-gradient(135deg, var(--accent-green) 0%, var(--secondary) 100%)';
          setTimeout(() => {
            circle.style.background = 'linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%)';
          }, 200);
        } else {
          combo = 0;
          circle.style.background = 'linear-gradient(135deg, var(--primary) 0%, var(--accent-orange) 100%)';
          setTimeout(() => {
            circle.style.background = 'linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%)';
          }, 300);
        }

        updateHUD();
      }

      function updateHUD() {
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        if (timerEl) timerEl.textContent = timeLeft + 's';
        if (scoreEl) scoreEl.textContent = score;
        if (comboEl) comboEl.textContent = combo;
      }

      function endGame() {
        clearInterval(timer);
        clearInterval(beatTimer);
        isPlaying = false;

        const isNewHigh = ScoreManager.updateHighScore(game.id, score);
        gameContent.innerHTML = `
          <div class="result-screen">
            <div style="font-size:60px;margin-bottom:20px;">🎵</div>
            <div class="result-label">音乐结束！</div>
            <div class="result-score">${score}</div>
            <div class="result-label">最终得分</div>
            <p style="color:var(--text-secondary);margin:10px 0;">最高连击: ${maxCombo}</p>
            ${isNewHigh ? '<div class="new-high">🏆 新纪录！</div>' : ''}
            <div style="margin-top:10px;color:var(--text-secondary);">
              最高分: ${ScoreManager.getHighScore(game.id)}
            </div>
            <button class="next-btn" style="margin-top:30px;" onclick="restartGame()">
              再玩一次 🔄
            </button>
          </div>
        `;
      }

      render();
    }

    // ==========================================

    function initFindDiff(game) {
      const EMOJIS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐸', '🐵', '🐔', '🐧'];

      let score = 0;
      let timeLeft = 60;

      let isPlaying = false;

      function render() {
        gameContent.innerHTML = `
          <div class="game-hud">
            <div class="hud-item">
              <div class="hud-label">⏱️ 时间</div>
              <div class="hud-value" id="timer">${timeLeft}s</div>
            </div>
            <div class="hud-item">
              <div class="hud-label">🎯 得分</div>

      function startGame() {

        timer = setInterval(() => {

      function nextRound() {

      function handleAnswer(side) {

        // Right side has the difference
        if (side === 'right') {
          score += 15;
          document.querySelector('.diff-image:last-child').style.animation = 'pulse 0.3s';
        } else {
          score = Math.max(0, score - 5);
          document.querySelector('.diff-image:first-child').style.animation = 'shake 0.3s';

      function updateHUD() {
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');

        if (timerEl) timerEl.textContent = timeLeft + 's';
